<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Install BrowserPlay TV</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0f172a radial-gradient(circle at 50% 0%, rgba(102, 126, 234, 0.15) 0%, transparent 50%);
            min-height: 100vh;
        }
        .btn-brand {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
        }
    </style>
</head>
<body class="p-6 flex flex-col items-center justify-center">

    <div class="w-full max-w-sm flex flex-col items-center gap-6">
        <div class="avatar">
            <div class="w-28 rounded-[2rem] ring ring-primary ring-offset-base-100 ring-offset-2 shadow-2xl">
                <img src="https://i.ibb.co/xSbjbr1S/image.png" alt="BrowserPlay TV" />
            </div>
        </div>

        <div class="card w-full bg-slate-900/40 backdrop-blur-xl border border-white/10 shadow-2xl">
            <div class="card-body p-8 items-center text-center">
                <h1 class="text-3xl font-black text-white tracking-tight">BrowserPlay TV</h1>
                <p class="text-[10px] font-bold uppercase tracking-[0.3em] opacity-50 mb-8">The Future of Streaming</p>

                <button id="installBtn" class="btn btn-brand btn-lg h-20 w-full shadow-lg hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-4">
                    <span class="material-symbols-outlined text-3xl">download_for_offline</span>
                    <div class="flex flex-col items-start gap-0">
                        <span class="font-black text-xl italic leading-none uppercase">Install App</span>
                        <span class="text-[9px] opacity-80 uppercase tracking-widest font-bold">Launch Full Experience</span>
                    </div>
                </button>

                <p class="mt-6 text-[11px] font-black text-primary/80 uppercase tracking-widest">Optimized for Chrome & Android</p>
            </div>
        </div>
    </div>

    <script>
        let deferredPrompt;

        // Register Service Worker (Required for Chrome prompt)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }

        // Listen for the Chrome Install Prompt event
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        // Trigger prompt on button click
        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    deferredPrompt = null;
                }
            }
        });

        // Auto-hide button if app is already installed
        window.addEventListener('appinstalled', () => {
            document.getElementById('installBtn').classList.add('hidden');
        });
    </script>
</body>
</html>
